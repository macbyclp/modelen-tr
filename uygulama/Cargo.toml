[package]
name = "modelen"
version = "0.5.2"
edition = "2021"
description = "Modelen: gönüllü GPU istemcisi ve kodlama yardımcısı (tek masaüstü uygulaması)"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui-winit = { version = "0.27", default-features = false, features = ["links"] }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
keyring = { version = "3", features = ["windows-native"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
