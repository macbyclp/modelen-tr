[package]
name = "modelen-kurulum"
version = "0.5.6"
edition = "2021"
description = "Modelen gönüllü kurulum programı: kur.ps1'i içine gömer ve çift tıklayınca çalıştırır"
license = "Apache-2.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
